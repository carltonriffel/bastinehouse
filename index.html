<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bastine House Framing Takeoff</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen app — 3D stage left, takeoff/cost panel right; stacks on phones. Dark-only by request. */
:root{
  --bg:#0c1116; --stage:#10171e; --panel:#141c24; --panel-2:#1a242e; --line:#26323e; --line-2:#334252;
  --fg:#e9e4d8; --muted:#8c99a5; --dim:#5f6d7a;
  --accent:#e6b062; --accent-ink:#1b1408; --truss:#6d9de3;
  --measure:#53d1e8; --ok:#69c48d; --warn:#ff7d5c; --info:#73a9de;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--body);margin:0;overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand h1{font:700 26px/1 var(--display);letter-spacing:.02em;margin:0;text-transform:uppercase}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
.kpis{display:flex;gap:6px;flex-wrap:wrap}
.pdfbox{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:3px;min-width:0}
.pdfbox .btn{padding:9px 14px;font-size:13px}
#pdf-msg{font-size:11px;color:var(--muted);max-width:220px;text-align:right}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-width:96px}
.kpi span{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi b{font:500 17px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.kpi.total{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.total span{color:var(--accent-ink);opacity:.75}

/* main */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:12px}
.viewer{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:0}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dl{position:absolute;transform:translate(-50%,-50%);font:500 11px/1 var(--mono);color:var(--accent);background:rgba(12,17,22,.82);border:1px solid var(--line-2);padding:3px 5px;border-radius:4px;white-space:nowrap}
.dl.h{color:var(--info)}
#mlabels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ml{position:absolute;transform:translate(-50%,-130%);font:600 12px/1 var(--mono);color:#06222a;background:var(--measure);padding:4px 6px;border-radius:4px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.ml.live{background:transparent;color:var(--measure);border:1px dashed var(--measure)}
.viewer.measuring #stage canvas{cursor:crosshair}
.mpanel{position:absolute;right:14px;top:12px;width:250px;max-height:calc(100% - 150px);overflow:auto;background:rgba(20,28,36,.95);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;font-size:12px}
.mpanel h4{margin:0 0 6px;font:600 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--measure);display:flex;justify-content:space-between;align-items:center}
.mpanel h4 button{background:none;border:1px solid var(--line-2);border-radius:5px;color:var(--muted);font:600 10.5px var(--display);letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;cursor:pointer}
.mpanel p{margin:0 0 6px;color:var(--muted)}
.mrow{display:grid;grid-template-columns:18px 1fr auto;gap:2px 8px;align-items:start;padding:5px 0;border-top:1px solid var(--line)}
.mrow b{font:600 13px var(--mono);color:var(--fg)}
.mrow small{grid-column:2;color:var(--muted);font:11px var(--mono)}
.mrow .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
.mrow .n{color:var(--measure);font:600 12px var(--mono)}
@media (max-width:560px){.mpanel{left:14px;right:auto;top:auto;bottom:200px;width:auto;max-width:calc(100% - 28px)}}
.hint{position:absolute;left:14px;top:12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;pointer-events:none}
.hint b{font:600 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--fg)}
.sel{position:absolute;left:14px;bottom:128px;max-width:300px;background:rgba(20,28,36,.95);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;font-size:12.5px}
.sel h4{margin:0 0 4px;font:600 15px var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.sel dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0}
.sel dt{color:var(--muted)} .sel dd{margin:0;font-family:var(--mono);font-size:12px}
.sel button{position:absolute;right:6px;top:6px;background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:4px}

/* dock */
.plan{position:absolute;inset:0;background:var(--stage);z-index:1}
.plan svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.plan svg.drag{cursor:grabbing}
.plantag{position:absolute;left:14px;top:12px;max-width:min(560px,calc(100% - 28px));font-size:12px;color:var(--muted);pointer-events:none}
.plantag b{display:block;font:600 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--fg)}
.hint,.sel,.mpanel{z-index:2}
.dock{z-index:3;position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:rgba(20,28,36,.94);border:1px solid var(--line-2);border-radius:14px;padding:8px 12px;box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:calc(100% - 24px)}
.vc{width:84px;height:84px;perspective:none;flex:none;position:relative}
.cube{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.face{position:absolute;width:52px;height:52px;left:-26px;top:-26px;display:grid;place-items:center;font:700 10px var(--display);letter-spacing:.08em;background:rgba(40,54,68,.92);border:1px solid #4a5d70;color:#cfd8e1;cursor:pointer;user-select:none;backface-visibility:hidden}
.face:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dock-c{display:flex;flex-direction:column;gap:6px;min-width:0}
.row{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.vb{background:var(--panel-2);border:1px solid var(--line-2);border-radius:7px;padding:5px 9px;font:600 12px var(--display);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;color:var(--fg)}
.vb:hover{border-color:var(--accent)}
.vb[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sep{width:1px;height:20px;background:var(--line-2);margin:0 2px}
.rng{display:flex;align-items:center;gap:6px;font:600 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input[type=range]{accent-color:var(--accent);width:110px}

/* panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1;background:none;border:0;padding:11px 6px 9px;font:600 14px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;display:flex;gap:6px;justify-content:center;align-items:center}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.badge{font:500 10px var(--mono);background:var(--warn);color:#1a0b06;border-radius:9px;padding:1px 6px}
.tabbody{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:0}
.tabbody>*{flex:none}
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px}
.card h3{margin:0 0 8px;font:600 14px var(--display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
select,input[type=number],input[type=text]{background:var(--bg);border:1px solid var(--line-2);border-radius:6px;padding:5px 8px;min-width:0;width:100%}
input[type=number]{font-family:var(--mono);font-size:12.5px;text-align:right}

.sum{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:13px}
.sum b{font:500 13px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.sum .t{border-top:1px solid var(--line-2);padding-top:6px;margin-top:4px;font-weight:600}
.sum .t+b{border-top:1px solid var(--line-2);padding-top:6px;margin-top:4px;color:var(--accent);font-size:15px}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:10px 0 4px;background:var(--bg)}
.stack i{display:block;height:100%}

.layer{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.layer.off{opacity:.55}
.lh{display:grid;grid-template-columns:30px 12px 1fr auto auto 26px;align-items:center;gap:8px;padding:9px 10px}
.eye{background:none;border:1px solid var(--line-2);border-radius:6px;width:28px;height:26px;display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.eye[aria-pressed="false"]{color:var(--dim)}
.sw{width:12px;height:12px;border-radius:3px}
.ln{min-width:0}
.ln b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln small{color:var(--muted);font-size:11.5px}
.inc{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);cursor:pointer}
.inc input{accent-color:var(--accent)}
.lc{font:500 13px var(--mono);text-align:right;min-width:72px;font-variant-numeric:tabular-nums}
.chev{background:none;border:0;cursor:pointer;color:var(--muted);width:26px;height:26px;display:grid;place-items:center;transition:transform .15s}
.chev[aria-expanded="true"]{transform:rotate(180deg)}
.lb{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
.labrow{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.labrow input{width:84px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font:600 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:4px 6px;border-bottom:1px solid rgba(38,50,62,.6);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td small{color:var(--muted);display:block;font-size:10.5px}
tfoot td{font-weight:600;border-bottom:0}
.grp{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px}
.grp h3{margin:0}
.grp span{font:500 12px var(--mono);color:var(--muted)}

.pb{display:grid;grid-template-columns:1fr 92px;gap:6px 10px;align-items:center;font-size:12.5px}
.pb label{color:var(--fg)} .pb label small{color:var(--muted);margin-left:4px}
.btn{background:var(--panel-2);border:1px solid var(--line-2);border-radius:7px;padding:6px 12px;cursor:pointer;font:600 12px var(--display);letter-spacing:.08em;text-transform:uppercase}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.note{font-size:12px;color:var(--muted);margin:0}

.chk{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.pill{font:600 10.5px var(--display);letter-spacing:.1em;text-transform:uppercase;border-radius:4px;padding:2px 7px;align-self:start;margin-top:1px;text-align:center;min-width:44px}
.pill.ok{background:rgba(105,196,141,.16);color:var(--ok);border:1px solid rgba(105,196,141,.4)}
.pill.warn{background:rgba(255,125,92,.14);color:var(--warn);border:1px solid rgba(255,125,92,.45)}
.pill.fix{background:rgba(230,176,98,.14);color:var(--accent);border:1px solid rgba(230,176,98,.45)}
.pill.info{background:rgba(115,169,222,.14);color:var(--info);border:1px solid rgba(115,169,222,.4)}
.chk b{font-weight:600;font-size:13px}
.chk p{margin:2px 0 0;color:var(--muted);font-size:12px}
.chk code{font-family:var(--mono);font-size:11.5px;color:var(--fg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

@media (max-width:980px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .main{grid-template-columns:1fr}
  .viewer{height:68vh;min-height:440px}
  .panel{max-height:none}
  .tabbody{overflow:visible}
}
@media (max-width:560px){
  .kpi{min-width:0;flex:1}
  .dock{flex-direction:column;gap:6px;padding:8px}
  .vc{width:70px;height:70px}
  .sel{bottom:auto;top:56px}
  .opt{grid-template-columns:1fr}
  .vb{padding:4px 7px;font-size:11px}
}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>

  </main>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =====================================================================
   1. GEOMETRY FROM THE DRAWINGS  (plan coords, feet)
   X: left → right (0–30) · Y: front wall face (0) → rear (26 main, 36'-1" bump)
   Z: elevation above top of slab
   ===================================================================== */
const IN = 1/12, P = 1.5*IN, T6 = 5.5*IN, T4 = 3.5*IN;
const WD = 30, DP = 26, RIDGE_DWG = 21.8;
// Truss chords: 2x4 top & bottom. Standard heel: top-chord bottom edge meets the bottom of the bottom chord at the
// outside face of the wall, so heel height (plate → top of top chord, plumb at outside face) = top-chord plumb depth.
const TC_D = 3.5/12, BC_D = 3.5/12;
const plumb = (d,p) => d*Math.sqrt(1+p*p);
const HEEL_R = plumb(TC_D,4/12), HEEL_F = plumb(TC_D,8/12);   // 3-11/16" rear, 4-3/16" front
let BK, PLATE1, SUB2, PLATE2B, YR, RTC, PLATE2F, RBC, SHED_SEAT, PORCH_SEAT, AREA_L1, BUMP_PLATE, LOFT_WIN, LOFT_HEAD, GABLE_HEAD;
const PB_ = 4/12, PF_ = 8/12;                 // rear / front main-roof pitch (A-9)
const JOIST_D = {syp:11.25, ij:11.875, ft:12, ft16:16};
// Resolved mode: plan strings close to the overall dims; plate heights stay as drawn and studs are cut from stock lengths.
function applyGeometry(){
  const Rz = state.geo==='resolved';
  BK = state.bedClear ? DP + state.bedClear + T6 + 2*DW          // bedroom set to a finished clear depth
     : (Rz ? 36 : 36 + 1/12);                                   // 10'+26' and 16'-1"+17'-9"+2'-2" both = 36'-0"
  PLATE1 = 9.0;                                                 // A-3–A-6 top of plate
  SUB2 = Rz ? PLATE1 + (JOIST_D[state.joist]+0.719)/12 : 10.1;  // I-joist → 10'-1 3/4" (matches A-4)
  PLATE2B = 18.3;                                               // A-3–A-6 top of plate
  YR = DP - (11 + 4/12);                                       // ridge line 11'-4" from rear (A-2 CL)
  RTC = PLATE2B + HEEL_R + (DP - YR)*PB_;                         // top-chord peak from rear plate + 4/12

  open:new Set(), explode:0, dims:true, ortho:false, tab:'layers', view:'3d', planFin:true, planDims:true
};

/* =====================================================================
   4. FORMATTERS
   ===================================================================== */
function ftin(ft){ const neg=ft<0; const tot=Math.round(Math.abs(ft)*96)/8; const f=Math.floor(tot/12+1e-9); const inch=tot-f*12; const whole=Math.floor(inch+1e-9); let n=Math.round((inch-whole)*8), d=8, fs='';
  if(n){ while(n%2===0){n/=2;d/=2;} fs=` ${n}/${d}`; } return `${neg?'-':''}${f}'-${whole}${fs}"`; }
function parseFtIn(s){ const m=s.match(/(\d+)'-(\d+)"/); return m? +m[1] + (+m[2])/12 : NaN; }
const money = v => '$'+Math.round(v).toLocaleString('en-US');
const money2 = v => '$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const num = (v,d=0) => v.toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:d});
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* =====================================================================
   5. FRAMING GENERATOR
   ===================================================================== */
const HDR_DEPTH = {'2x6':5.5,'2x8':7.25,'2x10':9.25,'2x12':11.25};
// Allowable spans (ft), (2) plies, #2 SYP — simplified from IRC Table R602.7(1), 28' bldg width, ≤30 psf ground snow
const HDR_SPAN = { 'roof':{'2x6':4.5,'2x8':5.75,'2x10':7.0,'2x12':8.25}, 'roof+floor':{'2x6':3.25,'2x8':4.25,'2x10':5.25,'2x12':6.0} };
const lvlSpan = (depthIn, bearing) => depthIn * (bearing==='roof' ? 1.0 : 0.82);

let M, OPEN_REC, STATS;
function add(m){ M.push(m); return m; }

function pickHeader(w, op, availIn){
  if(w.bearing==='none') return {type:'flat',sku:'SYP-'+w.size,label:`flat ${w.size} (non-bearing)`,depthIn:1.5,plies:1,ok:true,allow:null};
  const table = HDR_SPAN[w.bearing], span = op.w;
  const fits = Object.keys(HDR_DEPTH).filter(k=>HDR_DEPTH[k] <= availIn+0.01);
  const lvlFit = [11.875,9.25].find(d=>d<=availIn+0.01);
  const lvl = d => ({type:'lvl',sku:d===11.875?'LVL-11.875':'LVL-9.25',label:`(2) 1-3/4×${d===11.875?'11-7/8':'9-1/4'} LVL`,depthIn:d,plies:2,allow:lvlSpan(d,w.bearing),ok:span<=lvlSpan(d,w.bearing)});
  if(state.header==='lvl' && lvlFit) return lvl(lvlFit);
  let pick=null;
  if(state.header==='std'){ const k=fits[fits.length-1]; if(k && table[k]>=span) pick=k; }
  if(!pick) pick = fits.find(k=>table[k]>=span) || null;
  if(pick) return {type:'dim',sku:'SYP-'+pick,label:`(2) ${pick}`,depthIn:HDR_DEPTH[pick],plies:2,allow:table[pick],ok:true};
  if(lvlFit) return lvl(lvlFit);
  const k = fits[fits.length-1] || '2x6';
  return {type:'dim',sku:'SYP-'+k,label:`(2) ${k}`,depthIn:HDR_DEPTH[k],plies:2,allow:table[k],ok:false};
}

function studSku(size, lenFt, rake){
  const li = lenFt*12;
  return {sku:'SYP-'+size, mode:'piece'};
}

// T-intersections: where another wall on the same level butts into w (position along w)
function teesOf(w){ const out=[]; const tw=(w.size==='2x6'?T6:T4)/2+0.06;
  for(const o of WALLS){ if(o===w||o.axis===w.axis||Math.abs(o.base-w.base)>0.01) continue;
    if(o.at<w.from-0.01||o.at>w.to+0.01) continue;
    if(Math.abs(o.from-w.at)<=tw+0.25||Math.abs(o.to-w.at)<=tw+0.25) out.push({s:o.at,half:(o.size==='2x6'?T6:T4)/2,name:o.name}); }
  return out; }
const zoneOf = (op) => { const nj=op.w>6?2:1; const k=op.shared?0:1.5*IN; return [op.c-op.w/2-nj*1.5*IN-k, op.c+op.w/2+nj*1.5*IN+k]; };
function zoneOk(w,op,others,tees){ const [a,b]=zoneOf(op); if(a<w.from+0.05||b>w.to-0.05) return false;
  if(tees.some(t=>t.s+t.half>a-0.01&&t.s-t.half<b+0.01)) return false;
  return others.every(o=>{ const [c,d]=zoneOf(o); return b<c-0.01||a>d+0.01; }); }
const wallOC = w => (w.ext && w.size==='2x6' ? state.extOC : 16)*IN;
function layoutPos(w){ const OC=wallOC(w); const pos=[w.from+0.75*IN]; for(let k=1; w.from+k*OC < w.to-1.5*IN; k++) pos.push(w.from+k*OC); pos.push(w.to-0.75*IN); return pos; }
// Shift an opening ≤ 4" so the most layout studs fall inside its framing (king lands on layout)
function snapOpenings(w){ if(!state.snap||!w.openings?.length) return; const tees=teesOf(w), pos=layoutPos(w);
  w.openings = w.openings.map((op,i)=>{ if(op.fixed) return {...op,shift:0}; const others=w.openings.filter((_,j)=>j!==i);
    const score = o => { const [a,b]=zoneOf(o); return pos.filter(s=>s>a-0.75*IN&&s<b+0.75*IN).length; };
    let best={...op,shift:0}, bs=score(op);
    for(let d=-4; d<=4.001; d+=0.5){ if(!d) continue; const c={...op,c:op.c+d*IN,shift:d}; if(!zoneOk(w,c,others,tees)) continue; const sc=score(c);
      if(sc>bs || (sc===bs && Math.abs(d)<Math.abs(best.shift) && sc>score(op))){ best=c; bs=sc; } }
    return best; }); }

function genWall(w){
  const layer=w.layer, lvl=w.lvl, t = w.size==='2x6'?T6:T4;
  const rake = typeof w.top==='function';
  const topAt = s => rake ? w.top(s) : w.top;
  snapOpenings(w);
  const OC = wallOC(w);
  const L = w.to - w.from;
  const P3 = (s,z,off=0) => w.axis==='x' ? [s, w.at+off, z] : [w.at+off, s, z];
  const D3 = (along,up,th=t) => w.axis==='x' ? [along, th, up] : [th, along, up];
  const nm = w.name;
  // plates
  const bSku = (w.pt?'PT-':'SYP-')+w.size;
  add({layer,lvl,cat:'Plates',sku:bSku,mode:'lf',len:L,label:`Bottom plate${w.pt?' (PT on slab)':''} · ${nm}`,color:w.pt?COL.pt:COL.plate,g:{t:'box',c:P3((w.from+w.to)/2,w.base+P/2),s:D3(L,P)}});
  if(!rake){
    for(let i=0;i<2;i++) add({layer,lvl,cat:'Plates',sku:'SYP-'+w.size,mode:'lf',len:L,label:`${i?'Cap':'Top'} plate · ${nm}`,color:COL.plate,g:{t:'box',c:P3((w.from+w.to)/2,w.top-P/2-i*P),s:D3(L,P)}});
  } else {
    const pts=[w.from,...(w.breaks||[]).filter(b=>b>w.from&&b<w.to),w.to];
    for(let k=0;k<pts.length-1;k++){ const s0=pts[k], s1=pts[k+1];
      for(let i=0;i<2;i++){ const z0=topAt(s0)-P/2-i*P, z1=topAt(s1)-P/2-i*P; const len=Math.hypot(s1-s0,z1-z0);
        add({layer,lvl,cat:'Plates',sku:'SYP-'+w.size,mode:'piece',len,label:`Raked ${i?'cap':'top'} plate · ${nm}`,color:COL.plate,
          g:{t:'stick',a:P3(s0,z0),b:P3(s1,z1),w:t,d:P,axis:w.axis}}); } }
  }
  const z0 = w.base + P;
  const studTop = s => topAt(s) - 2*P;
  const addStud = (s,label,top=null,cat='Studs') => { const tp = top ?? studTop(s); const len = tp - z0; if(len<=0.05) return;
    const ss = studSku(w.size,len,rake);
    add({layer,lvl,cat,sku:ss.sku,mode:ss.mode,len,label:`${label} · ${nm}`,color:COL.stud,g:{t:'box',c:P3(s,(z0+tp)/2),s:D3(1.5*IN,len)}}); };
  const zones=[];
  // openings
  for(const op of (w.openings||[])){
    const Lo = op.c-op.w/2, Ro = op.c+op.w/2, nj = op.w>6?2:1;
    zones.push(zoneOf(op));
    const topMin = rake ? Math.min(topAt(Lo-0.3),topAt(Ro+0.3)) : w.top;
    const avail = (topMin - 2*P - op.head)*12;
    const hdr = pickHeader(w, op, avail);
    const hLen = op.w + 2*nj*1.5*IN;
    let hdrBot, hdrTop;
    if(hdr.type==='flat'){ hdrBot = op.head; hdrTop = op.head + P;
      add({layer,lvl,cat:'Headers',sku:hdr.sku,mode:'lf',len:hLen,label:`Flat header ${op.label} · ${nm}`,color:COL.header,g:{t:'box',c:P3(op.c,op.head+P/2),s:D3(hLen,P)}});
    } else {
      hdrTop = topMin - 2*P; hdrBot = hdrTop - hdr.depthIn/12;
      const ply = hdr.type==='lvl'?1.75*IN:1.5*IN;
      const offs = [-(t/2-ply/2), (t/2-ply/2)];
      for(let i=0;i<hdr.plies;i++) add({layer,lvl,cat:'Headers',sku:hdr.sku,mode:hdr.type==='lvl'?'lfx':'lf',len:hLen,label:`Header ${hdr.label} over ${op.label} · ${nm}`,color:hdr.type==='lvl'?COL.lvl:COL.header,
        g:{t:'box',c:P3(op.c,(hdrBot+hdrTop)/2,offs[i]),s:D3(hLen,hdr.depthIn/12,ply)}});
      if(hdrBot - op.head > 1.5*IN){ // head flat + short cripples
        add({layer,lvl,cat:'Shorts',sku:'SYP-'+w.size,mode:'lf',len:op.w,label:`Head flat ${op.label} · ${nm}`,color:COL.short,g:{t:'box',c:P3(op.c,op.head+P/2),s:D3(op.w,P)}});
        const cl = hdrBot-(op.head+P);
        if(cl>0.08) for(const s of cripplePos(Lo,Ro,w.from,OC)) add({layer,lvl,cat:'Shorts',sku:'SYP-'+w.size,mode:'lf',len:cl,label:`Cripple (head) · ${nm}`,color:COL.short,g:{t:'box',c:P3(s,op.head+P+cl/2),s:D3(1.5*IN,cl)}});
      }
    }
    // jacks & kings
    for(let i=0;i<nj;i++){ for(const s of [Lo-(i+0.5)*1.5*IN, Ro+(i+0.5)*1.5*IN]) addStud(s,`Jack stud ${op.label}`,hdr.type==='flat'?op.head:hdrBot); }
    if(!op.shared) for(const s of [Lo-nj*1.5*IN-0.75*IN, Ro+nj*1.5*IN+0.75*IN]) addStud(s,`King stud ${op.label}`);
    // cripples above header
    for(const s of cripplePos(Lo-nj*1.5*IN,Ro+nj*1.5*IN,w.from,OC)){ const tp=studTop(s); const cl=tp-hdrTop; if(cl>0.08) add({layer,lvl,cat:'Shorts',sku:'SYP-'+w.size,mode:cl>4?'piece':'lf',len:cl,label:`Cripple (above header) · ${nm}`,color:COL.short,g:{t:'box',c:P3(s,hdrTop+cl/2),s:D3(1.5*IN,cl)}}); }
    // sill + cripples below
    if(op.type==='win'){
      const sillPlies = op.w>=4 ? 2 : 1;
      for(let i=0;i<sillPlies;i++) add({layer,lvl,cat:'Shorts',sku:'SYP-'+w.size,mode:'lf',len:op.w,label:`${sillPlies>1?'Double ':''}sill ${op.label} · ${nm}`,color:COL.short,g:{t:'box',c:P3(op.c,op.sill-P/2-i*P),s:D3(op.w,P)}});
      const cl = op.sill - sillPlies*P - z0;
      if(cl>0.08) for(const s of cripplePos(Lo,Ro,w.from,OC)) add({layer,lvl,cat:'Shorts',sku:'SYP-'+w.size,mode:'lf',len:cl,label:`Cripple (below sill) · ${nm}`,color:COL.short,g:{t:'box',c:P3(s,z0+cl/2),s:D3(1.5*IN,cl)}});
    }
    OPEN_REC.push({wall:nm,id:w.id,label:op.label,ro:op.w,head:op.head,avail,hdr,bearing:w.bearing,shift:op.shift||0,shared:!!op.shared,c:op.c,zone:zoneOf(op),tees:teesOf(w)});
  }
  // point-load columns
  for(const s of (w.points||[])){ zones.push([s-3*IN,s+3*IN]); for(const d of [-1.5,0,1.5]) addStud(s+d*IN,'Beam bearing column'); }
  // common studs on layout
  for(const s of layoutPos(w)){ if(zones.some(([a,b])=>s>a-0.75*IN && s<b+0.75*IN)) continue; addStud(s,'Stud'); }
  // corner / T backers
  for(let i=0;i<(w.ends?.[0]||0);i++) addStud(w.from+(0.75+1.5*(i+1))*IN,'Corner/backer stud');
  for(let i=0;i<(w.ends?.[1]||0);i++) addStud(w.to-(0.75+1.5*(i+1))*IN,'Corner/backer stud');
  // fireblocking for tall rake walls (R602.8 — 10' max concealed space)
  if(rake){ // only where studs exceed 10' — block sits 9'-6" up, always below the raked plate
    let a=null,b=null; for(let s=w.from; s<=w.to+1e-6; s+=0.05){ if(studTop(s)-z0>10){ if(a===null) a=s; b=s; } }
    if(a!==null && b-a>0.2){ const zb=z0+9.5, len=b-a; add({layer,lvl,cat:'Shorts',sku:'SYP-'+w.size,mode:'lf',len,label:`Fire blocking (studs > 10') · ${nm}`,color:COL.short,g:{t:'box',c:P3((a+b)/2,zb),s:D3(len,P)}}); } }
  // sheathing
  if(w.sheath) genSheath(w);
  return L;
}
function cripplePos(a,b,origin,OC){ const out=[a+0.75*IN]; let k=Math.ceil((a-origin)/OC); for(;origin+k*OC < b-1.5*IN; k++){ const s=origin+k*OC; if(s>a+3*IN) out.push(s); } out.push(b-0.75*IN); return out; }

function genSheath(w){
  const sh=w.sheath, rake=typeof sh.top==='function', topAt = s=>rake?sh.top(s):sh.top;
  const xs=[sh.from,...(sh.breaks||[]).filter(b=>b>sh.from&&b<sh.to),sh.to];
  const pts=[[sh.from,sh.z0],[sh.to,sh.z0]]; for(let i=xs.length-1;i>=0;i--) pts.push([xs[i],topAt(xs[i])]);
  let area=0; for(let i=0;i<pts.length;i++){ const [x1,y1]=pts[i],[x2,y2]=pts[(i+1)%pts.length]; area+=x1*y2-x2*y1; } area=Math.abs(area)/2;
  const holes=[];
  for(const op of (w.openings||[])){ const a=op.c-op.w/2, b=op.c+op.w/2; if(a<sh.from||b>sh.to) continue; const lo = op.sill ?? sh.z0+0.04; holes.push([[a,lo],[b,lo],[b,op.head],[a,op.head]]); area -= op.w*(op.head-lo); }
  add({layer:'wsheath',lvl:w.lvl,cat:'Sheathing',sku:'OSB-716',mode:'area',area,label:`7/16" OSB · ${w.name} (${num(area)} sf net)`,color:COL.osb,
    g:{t:'shape',axis:w.axis,outer:sh.outer+sh.side*0.035,pts,holes}});
}

function genFloor(){
  const J = {syp:{sku:'SYP-2x12',mode:'piece',d:11.25,oc:16,w:1.5,name:'2x12 #2 SYP',rim:'SYP-2x12',rimMode:'lf',rimT:1.5},
             ij:{sku:'IJ-11.875',mode:'piece',d:11.875,oc:16,w:2.0625,name:'11-7/8" I-joist',rim:'RIM-11.875',rimMode:'lfx',rimT:1.125},
             ft:{sku:'FT-12',mode:'lfx',d:12,oc:24,w:3.5,name:'12" open-web floor truss',rim:'RIM-11.875',rimMode:'lfx',rimT:1.125,truss:true},
             ft16:{sku:'FT-16',mode:'lfx',d:16,oc:24,w:3.5,name:'16" open-web floor truss',rim:'RIM-11.875',rimMode:'lfx',rimT:1.125,truss:true}}[state.joist];
  const layer='floor', lvl=1, top=SUB2-0.719*IN, bot=top-J.d*IN, zc=(top+bot)/2, dz=J.d*IN, rimT=J.rimT*IN, OC=J.oc*IN;
  const BEAM_Y=12.0, BW=5.25*IN;

  let hangers=0;
  const joist=(X,y0,y1,label)=>{ const len=y1-y0;
    if(!J.truss){ add({layer,lvl,cat:'Joists',sku:J.sku,mode:J.mode,len,label:`${J.name} ${label}`,color:COL.joist,g:{t:'box',c:[X,(y0+y1)/2,zc],s:[J.w*IN,len,dz]}}); return; }
    // open-web floor truss: 4x2 chords laid flat, diagonal webs, open duct chase panel mid-span
    add({layer,lvl,cat:'Floor trusses',sku:J.sku,mode:'lfx',len,label:`${J.name} ${label}`});
    const tag=`${J.name} ${label}`, ch=1.5*IN, zt=top-ch/2, zb=bot+ch/2, cy=(y0+y1)/2, half=J.d>=16?1.25:0.9;
    const V=(a,b,l)=>add({layer,lvl,cat:'Floor trusses',sku:null,mode:'none',label:`${tag} · ${l}`,color:COL.truss,g:{t:'stick',a:[X,a[0],a[1]],b:[X,b[0],b[1]],w:3.5*IN,d:1.5*IN}});
    V([y0,zt],[y1,zt],'top chord'); V([y0,zb],[y1,zb],'bottom chord');
    V([y0+0.12,zb],[y0+0.13,zt],'end vertical'); V([y1-0.12,zb],[y1-0.13,zt],'end vertical');
    V([cy-half,zb],[cy-half+0.01,zt],'chase vertical'); V([cy+half,zb],[cy+half-0.01,zt],'chase vertical');
    for(const [a,b] of [[y0+0.13,cy-half],[cy+half,y1-0.13]]){ const n=Math.max(1,Math.round((b-a)/2.5)), st=(b-a)/n;
      for(let i=0;i<n;i++){ const ya=a+i*st, yb=ya+st; V(i%2?[ya,zt]:[ya,zb], i%2?[yb,zb]:[yb,zt],'web'); } }
  };
  const SG=stairGeom(), HOLE=SG.ext, HX0=SG.X0-0.06, HY=SG.YT+0.04, HDW=3.5*IN;   // stair hole: B1 stops at a post by the stair, trimmer + header frame the opening
  for(const X of xsAll){ if(HOLE && X>HX0-0.65){ if(X>HX0+0.2){ joist(X,HY+HDW,DP-rimT,'· rear bay (off stair header)'); hangers++; } continue; } joist(X,BEAM_Y+BW/2,DP-rimT,'· rear bay'); hangers++; }
  if(HOLE){ for(const X of [HX0-J.w*IN/2, HX0-1.5*J.w*IN]) joist(X,BEAM_Y+BW/2,DP-rimT,'· double trimmer at stair opening'); hangers+=2;
    for(let i=0;i<2;i++) add({layer,lvl,cat:'Beam',sku:'LVL-11.875',mode:'lfx',len:WD-rimT-HX0,label:'Stair header · (2) 1-3/4×11-7/8 LVL (hangers to trimmer + rim)',color:COL.lvl,g:{t:'box',c:[(HX0+WD-rimT)/2,HY+(i+0.5)*1.75*IN,top-11.875*IN/2],s:[WD-rimT-HX0,1.75*IN,11.875*IN]}});
    hangers+=2; }
  for(const X of xsAll.filter(x=>x<8.6)){ joist(X,rimT,BEAM_Y-BW/2,'· loft/storage bay'); hangers++; }
  for(const X of [8.94-J.w*IN, 8.94]) joist(X,rimT,BEAM_Y-BW/2,'· double trimmer at open-below');
  // rim / band
  const rim=(c,s,len,label)=>add({layer,lvl,cat:'Rim',sku:J.rim,mode:J.rimMode,len,label,color:COL.rim,g:{t:'box',c,s}});
  rim([WD/2,rimT/2,zc],[WD,rimT,dz],WD,'Front rim / band (spans open-below)');
  rim([WD/2,DP-rimT/2,zc],[WD,rimT,dz],WD,'Rear rim');
  { const ye=HOLE?HY:BEAM_Y-BW/2; rim([WD-rimT/2,ye/2,zc],[rimT,ye,dz],ye,HOLE?'Right band at open-below + stair opening':'Right band at open-below'); }
  // flush beam B1
  const BL=HOLE?HX0-1.5*J.w*IN*0-0.0:WD; STATS.b1End=BL; STATS.stairHole=HOLE;
  for(let i=0;i<3;i++) add({layer,lvl,cat:'Beam',sku:'LVL-11.875',mode:'lfx',len:BL,label:`Flush beam B1 · (3) 1-3/4×11-7/8 LVL, 2 spans${HOLE?' (stops at the stair)':''}`,color:COL.lvl,g:{t:'box',c:[BL/2,BEAM_Y-BW/2+(i+0.5)*1.75*IN,top-11.875*IN/2],s:[BL,1.75*IN,11.875*IN]}});
  if(HOLE){ add({layer,lvl:0,cat:'Posts',sku:'PSL-5.25',mode:'lfx',len:top-11.875*IN,label:'Column P2 at the stair (B1 end + trimmer) · 5-1/4" PSL',color:COL.lvl,g:{t:'box',c:[BL-2.625*IN,BEAM_Y,(top-11.875*IN)/2],s:[5.25*IN,5.25*IN,top-11.875*IN]}}); }
  add({layer,lvl:0,cat:'Posts',sku:'PSL-5.25',mode:'lfx',len:top-11.875*IN,label:'Column P1 under beam B1 · 5-1/4" PSL',color:COL.lvl,g:{t:'box',c:[14.67,BEAM_Y,(top-11.875*IN)/2],s:[5.25*IN,5.25*IN,top-11.875*IN]}});
  // subfloor 4x8 tiles, long edge across joists, staggered
  const regions=HOLE?[[0,HX0,BEAM_Y,DP],[HX0,WD,HY,DP],[0,9.0,0,BEAM_Y]]:[[0,WD,BEAM_Y,DP],[0,9.0,0,BEAM_Y]];
  let area=0;

// #2 SYP reference design values (SPIB 2013): Fb by size, Fv 175 psi, E 1,400,000 psi; roof live load CD = 1.25
const PORCH_DL = 15, PORCH_LL = 20;                                   // psf: roof + shingles + ceiling / roof live (no snow)
const BEAM_D = {'2x6':5.5,'2x8':7.25,'2x10':9.25,'2x12':11.25}, BEAM_FB = {'2x6':1000,'2x8':925,'2x10':800,'2x12':750};
function beamCheck(size,plies,Lft,wTL,wLL){
  const b=1.5*plies, d=BEAM_D[size], S=b*d*d/6, I=b*d**3/12, A=b*d, L=Lft*12, E=1.4e6, CD=1.25;
  const M=wTL*Lft*Lft/8*12, V=wTL*Lft/2;                                 // in-lb, lb (simple span between posts)
  const fb=M/S, Fb=BEAM_FB[size]*CD, fv=1.5*V/A, Fv=175*CD;
  const dLL=5*(wLL/12)*L**4/(384*E*I), dTL=5*(wTL/12)*L**4/(384*E*I);
  const ok = fb<=Fb && fv<=Fv && dLL<=L/240 && dTL<=L/180;
  return {Lft,fb,Fb,fv,Fv,dLL,dTL,rLL:L/dLL,rTL:L/dTL,ok};
}
function sizePorchBeam(Lmax,wTL,wLL,pliesList=[2,3]){
  for(const plies of pliesList) for(const size of ['2x6','2x8','2x10','2x12']){ const c=beamCheck(size,plies,Lmax,wTL,wLL); if(c.ok) return {size,plies,ok:true}; }
  return {size:'2x12',plies:pliesList[pliesList.length-1],ok:false};
}
function genPorch(){

  const xs=[]; for(let x=2;x<=28.01;x+=2) xs.push(x);
  for(const X of xs){ const ph=plumb(2.75/12,SHED_P), a=[X,-1.5*IN,porchSeat(-1.5*IN)+ph], b=[X,yE,porchSeat(yE)+ph];

  const posts=[x0+0.25, XD-ENTRY_W/2, XD+ENTRY_W/2, x1-0.25];

      g:{t:'box',c:[(a+b)/2,yB+(i-(beam.plies-1)/2)*1.5*IN,(bt+bb)/2],s:[len-0.01,1.5*IN,bd]}}); }
  STATS.porchBeam={...beam, spans, trib, W_TL, W_LL, checks:spans.map(L=>beamCheck(beam.size,beam.plies,L,W_TL,W_LL))};
  for(const X of posts) add({layer,lvl,cat:'Posts',sku:'PT-6x6',mode:'piece',len:bb,label:'Porch post 6x6 PT',color:COL.post,g:{t:'box',c:[X,yB,bb/2],s:[5.5*IN,5.5*IN,bb]}});

  genEntryGable(layer,lvl,yE,posts);

// Entry gable over the steps (A-4 / A-9): 8/12 gable between the step posts, ridge level, stick framed
// (California-style) on top of the 2/12 porch sheathing.
function genEntryGable(layer,lvl,yE,posts){
  const Xc=(posts[1]+posts[2])/2, HW=(posts[2]-posts[1])/2, GP=8/12;
  const deck = Y => porchSeat(Y) + plumb(5.5/12,SHED_P) + 0.04;     // top of porch roof sheathing
  const zE = deck(yE), zR = zE + HW*GP;                              // gable deck meets the porch deck at the front corners (A-4: gable eaves drop to the porch fascia)
  const yEnd = yE + (zR-zE)/SHED_P;                                  // ridge meets the porch roof plane
  const hw = Y => HW*(yEnd-Y)/(yEnd-yE);                             // valley half-width along the ridge
  const yWall = -1.5*IN;                                             // face of the porch ledger on the house wall
  const yStop = Math.min(yEnd, yWall);                               // a wide gable runs into the wall before the roofs meet
  const atWall = yEnd > yWall;
  const tag='Entry gable 8/12';
  STATS.entry={Xc,HW,zE,zR,yEnd,yE,atWall,wallRise:atWall?(zR-(deck(yWall)+1.5/12)):0,wallHW:atWall?hw(yWall):0};
  // Simple stick framing on top of the porch sheathing: 2x8 valley plates laid flat, level 2x6 ridge board,
  // 2x6 rafters @ 16" from the ridge down to the valley plates, and a 2x6 rafter pair + studs at the front gable.
  const R6=plumb(5.5/12,GP), plane = x => zR - x*GP - 0.04;          // underside of the gable sheathing at x from the ridge
  const yG = yE-0.0625-0.75*IN;                                      // gable end hangs on the face of the porch sub-fascia
  const ridgeTop = plane(0.75*IN), ridgeLen = yStop-(yG-0.75*IN), ridgeBot = ridgeTop-7.25*IN;
  add({layer,lvl,cat:'Rafters',sku:'SYP-2x8',mode:'piece',len:ridgeLen,label:`${tag} · 2x8 ridge board (level${atWall?', hung at the house wall':''})`,color:COL.rafter,
       g:{t:'box',c:[Xc,(yG-0.75*IN+yStop)/2,ridgeTop-7.25/24],s:[1.5*IN,ridgeLen,7.25*IN]}});
  // ridge posts: 2x4 from the porch deck (over a porch rafter) up to the ridge, every 3' where there is room
  for(let y=yE+2.5; y<yStop-0.3; y+=3){ const z0=deck(y), h=ridgeBot-z0; if(h<0.25) break;
    add({layer,lvl,cat:'Rafters',sku:'SYP-2x4',mode:'lf',len:h,label:`${tag} · 2x4 ridge post on the porch deck`,color:COL.short,g:{t:'box',c:[Xc,y,z0+h/2],s:[3.5*IN,1.5*IN,h]}}); }
  // valley boards: 2x12 laid flat on the porch sheathing, set in from the valley line so the jack seats land on them
  const pTop=1.5*IN, VB=11.25*IN, vOff=0.18;                           // board's outer edge 2" inside the valley line
  for(const sd of [-1,1]){ const c=y=>Math.max(VB/2+0.02,hw(y)-vOff-VB/2), A=[Xc+sd*c(yG),yG,deck(yG)+pTop/2], B=[Xc+sd*c(yStop),yStop,deck(yStop)+pTop/2];
    add({layer,lvl,cat:'Rafters',sku:'SYP-2x12',mode:'piece',len:stickLen(A,B),label:`${tag} · 2x12 valley board, flat on porch sheathing`,color:COL.short,g:{t:'stick',a:A,b:B,w:VB,d:pTop}}); }
  // jack rafters @ 16": plumb cut at the ridge, top edge on the 8/12 plane out to the valley, level seat on the valley board
  let nR=0;
  for(let y=yE+16*IN; y<yStop-0.25; y+=16*IN){ const h=hw(y), dk=deck(y), pt0=dk+pTop;
    const xt=Math.min(h-0.02,(zR-0.04-pt0)/GP), xs=(zR-0.04-R6-pt0)/GP; if(xs<0.25) continue;     // top edge meets the board top / bottom edge meets the board top
    for(const sd of [-1,1]){ const X=x=>Xc+sd*x;
      const pts=[[X(0.0625),plane(0.0625)],[X(xt),pt0],[X(xs),pt0],[X(0.0625),plane(0.0625)-R6]];
      add({layer,lvl,cat:'Rafters',sku:'SYP-2x6',mode:'piece',len:Math.hypot(xt,xt*GP)+0.25,label:`${tag} · 2x6 jack rafter @ 16" (ridge to valley board)`,color:COL.rafter,g:{t:'prof',y,th:1.5*IN,pts:sd<0?pts.slice().reverse():pts}}); nR++; } }
  // front gable end: 2x6 rafter pair + 2x4 bottom plate + 2x4 studs @ 16", hung on the sub-fascia face so its eaves line up with the porch fascia bottom (A-4)
  const zFt = plane(HW)-R6;                                          // rafter-foot bottom = porch fascia bottom
  add({layer,lvl,cat:'Rafters',sku:'SYP-2x4',mode:'lf',len:2*HW,label:`${tag} · 2x4 gable bottom plate (nailed to the sub-fascia)`,color:COL.short,g:{t:'box',c:[Xc,yG,zFt+0.75*IN],s:[2*HW,1.5*IN,1.5*IN]}});
  for(const sd of [-1,1]){ const A=[Xc+sd*HW,yG,plane(HW)-R6/2], B=[Xc+sd*0.0625,yG,plane(0.0625)-R6/2];
    add({layer,lvl,cat:'Rafters',sku:'SYP-2x6',mode:'piece',len:stickLen(A,B),label:`${tag} · 2x6 front gable rafter`,color:COL.rafter,g:{t:'stick',a:A,b:B,w:1.5*IN,d:5.5*IN}}); nR++; }
  for(let dx=-HW+16*IN; dx<HW-0.3; dx+=16*IN){ if(Math.abs(dx)<0.1) continue; const top=plane(Math.abs(dx))-R6, z0=zFt+1.5*IN, len=top-z0; if(len<0.2) continue;
    add({layer,lvl,cat:'Rafters',sku:'SYP-2x4',mode:'lf',len,label:`${tag} · 2x4 gable stud @ 16"`,color:COL.short,g:{t:'box',c:[Xc+dx,yG,z0+len/2],s:[1.5*IN,1.5*IN,len]}}); }
  { const top=ridgeBot, z0=zFt+1.5*IN; add({layer,lvl,cat:'Rafters',sku:'SYP-2x4',mode:'lf',len:top-z0,label:`${tag} · 2x4 gable center stud (under ridge)`,color:COL.short,g:{t:'box',c:[Xc,yG,(top+z0)/2],s:[3.5*IN,1.5*IN,top-z0]}}); }
  STATS.entryRafters=nR;

    const hW=hw(yWall), zb=deck(yWall)+1.5*IN;
    for(const sd of [-1,1]){ const A=[Xc+sd*(hW+0.05),yWall+0.07,zb+0.12], B=[Xc+sd*0.06,yWall+0.07,plane(0.06)-R6/2];
      add({layer,lvl,cat:'Rafters',sku:'SYP-2x6',mode:'piece',len:stickLen(A,B),label:`${tag} · 2x6 wall nailer where the gable meets the house`,color:COL.rafter,g:{t:'stick',a:A,b:B,w:1.5*IN,d:5.5*IN}}); } }
  // gable face sheathing (OSB) and roof deck (two triangles per side)

  add({layer:'rsheath',lvl:1.1,cat:'Roof deck',sku:'OSB-716',mode:'area',area:fA,label:`${tag} · gable face 7/16" OSB (${num(fA,1)} sf)`,color:COL.osb,
       g:{t:'tri',pts:[[Xc-HW,yG-0.08,plane(HW)-R6],[Xc+HW,yG-0.08,plane(HW)-R6],[Xc,yG-0.08,zR-0.02]]}});

  for(const sd of [-1,1]){ const P1=[Xc,yG-0.15,zR+0.01], P2=[Xc+sd*(HW+0.17),yG-0.15,zE-0.17*GP+0.01];

}

function polyArea(pts){ let a=0; for(let i=0;i<pts.length;i++){ const [x1,y1]=pts[i],[x2,y2]=pts[(i+1)%pts.length]; a+=x1*y2-x2*y1; } return Math.abs(a)/2; }

const STD_LEN=[8,10,12,14,16,18,20,22,24];
function stockLen(len){ for(const s of STD_LEN) if(s >= len-0.02) return s; return null; }
const wasteF = sku => 1 + (state.waste[PB[sku].w]||0)/100;
const KERF = 0.125*IN;
let OPT = {used:0,bought:0};
// Best-fit-decreasing cutting: splits > 20' into 16' runs (staggered splices), opens 16' stock (or longer for long pieces), then shrinks each stick to the shortest standard length that holds its cuts.
function optimizeCuts(lengths){
  const items=[]; for(let L of lengths){ while(L>20.01){ items.push(16); L-=16; } if(L>0.02) items.push(L); }
  items.sort((a,b)=>b-a); const bins=[];
  for(const it of items){ let bin=null, best=Infinity;
    for(const b of bins){ const r=b.rem-it-KERF; if(r>=-1e-6 && r<best){ best=r; bin=b; } }
    if(!bin){ const st = it>16-KERF ? stockLen(it) : 16; bin={stock:st,rem:st,used:0,n:0}; bins.push(bin); }
    bin.rem-=it+KERF; bin.used+=it; bin.n++; }
  const counts=new Map(); let used=0, bought=0;
  for(const b of bins){ const need=b.stock-b.rem-KERF; const st=stockLen(need)||b.stock; counts.set(st,(counts.get(st)||0)+1); used+=b.used; bought+=st; }
  return {counts,used,bought}; }
const isDim = sku => sku && (sku.startsWith('SYP-')||sku.startsWith('PT-'));
const price = sku => state.prices[sku]*state.market;

function linesFor(layerId){
  const map=new Map(); const opt=new Map();
  for(const m of M){ if(m.layer!==layerId||m.mode==='none'||!m.sku) continue;
    if(state.cutopt && isDim(m.sku) && (m.mode==='piece'||m.mode==='lf')){ const e=opt.get(m.sku)||{lens:[],uses:new Set()}; e.lens.push(m.len); e.uses.add(m.cat); opt.set(m.sku,e); continue; }
    let key, stock=null;
    if(m.mode==='piece'){ stock=stockLen(m.len); if(stock===null){ const n=Math.ceil(m.len/16); key=m.sku+'|16'; const e=map.get(key)||{sku:m.sku,mode:'piece',stock:16,n:0,uses:new Set()}; e.n+=n; e.uses.add(m.cat); map.set(key,e); continue; } key=m.sku+'|'+stock; }
    else key=m.sku+'|'+m.mode;
    const e=map.get(key)||{sku:m.sku,mode:m.mode,stock,n:0,lf:0,area:0,uses:new Set()};
    e.n+= m.mode==='ea'?m.qty:1; e.lf+=m.len||0; e.area+=m.area||0; e.uses.add(m.cat); map.set(key,e);
  }
  for(const [sku,e] of opt){ const r=optimizeCuts(e.lens); OPT.used+=r.used; OPT.bought+=r.bought; const yld=r.used/r.bought*100;
    for(const [st,n] of r.counts) map.set(sku+'|opt|'+st,{sku,mode:'opt',stock:st,n,uses:new Set([...e.uses,`cut-optimized ${num(yld)}% yield`])}); }
  const out=[];
  for(const e of map.values()){ const pb=PB[e.sku], wf=wasteF(e.sku); let qty,unit,uc,desc=pb.name,lf=0;
    if(e.mode==='opt'){ qty=Math.ceil(e.n*wf); unit='pcs'; uc=price(e.sku)*e.stock; desc+=` × ${e.stock}'`; lf=qty*e.stock; }
    else if(e.mode==='piece'){ qty=Math.ceil(e.n*wf); unit='pcs'; uc=price(e.sku)*e.stock; desc+=` × ${e.stock}'`; lf=qty*e.stock; }
    else if(e.mode==='count'){ qty=Math.ceil(e.n*wf); unit='pcs'; uc=price(e.sku); }
    else if(e.mode==='lf'){ qty=Math.ceil(e.lf*wf/16); unit='pcs'; uc=price(e.sku)*16; desc+=` × 16' (cut list ${num(e.lf)} LF)`; lf=qty*16; }
    else if(e.mode==='lfx'){ qty=Math.ceil(e.lf*wf); unit='LF'; uc=price(e.sku); lf=qty; }
    else if(e.mode==='area'){ qty=Math.ceil(e.area*wf/(pb.sf||32)); unit='sheets'; uc=price(e.sku); desc+=` (${num(e.area)} sf)`; }
    else { qty=Math.ceil(e.n*wf); unit=pb.unit==='ea'?'ea':pb.unit; uc=price(e.sku); }
    const bf = pb.bfEa ? qty*pb.bfEa : (pb.bf ? lf*pb.bf : 0);
    out.push({sku:e.sku,cat:pb.cat,desc,qty,unit,uc,cost:qty*uc,uses:[...e.uses].join(', '),bf,stock:e.stock});
  }
  out.sort((a,b)=>CAT_ORDER.indexOf(a.cat)-CAT_ORDER.indexOf(b.cat)||b.cost-a.cost);
  return out;
}

const WTYPE={DH:'Double hung',FX:'Fixed',SC:'Casement (SC)',RS:'Slider (RS)',MU:'Tall unit (MU)'};
function scheduleData(){
  const wins=new Map(), doors=new Map();
  for(const w of WALLS) for(const op of (w.openings||[])){
    const lbl=op.label, mm=lbl.match(/^\((\d+)\)\s*(\d{4,5})([A-Z]*)/), m=mm?null:lbl.match(/^(\d{4,5})([A-Z]*)/);
    const units=mm?+mm[1]:1, code=mm?mm[2]:(m?m[1]:lbl), suf=mm?mm[3]:(m?m[2]:'');
    const rec=OPEN_REC.find(r=>r.id===w.id && r.label===lbl), lvl=w.base>1?2:1, loc=`${w.name} (L${lvl})`;
    const roH=op.sill==null ? op.head-w.base : op.head-op.sill;
    if(op.type==='win'){ const [uw,uh]=parseCode(code), key=`${code}${suf}|${units}`;
      const e=wins.get(key)||{code:`${code}${suf}`,units,type:(units>1?`(${units}) mulled `:'')+(WTYPE[suf]||suf||'Window'),unit:`${ftin(uw/12)} × ${ftin(uh/12)}`,ro:`${ftin(op.w)} × ${ftin(roH)}`,head:ftin(op.head-w.base),hdr:rec?rec.hdr.label:'',qty:0,locs:[],ops:[]};
      e.qty+=1; e.locs.push(loc); e.ops.push(op); wins.set(key,e); }
    else { const kind=op.pocket?'Pocket door':op.barn?'Barn door (surface track, cased opening)':op.bifold?'Bifold closet door':/cased/.test(lbl)?'Cased opening':w.ext?'Exterior swing door':'Interior swing door';
      const [dw,dh]=parseCode(code), key=`${code}|${kind}`;
      const e=doors.get(key)||{code,kind,unit:/cased/.test(lbl)?'—':`${ftin(dw/12)} × ${ftin(dh/12)}`,ro:`${ftin(op.w)} × ${ftin(roH)}`,head:ftin(op.head-w.base),hdr:rec?rec.hdr.label:'',qty:0,locs:[],ops:[]};
      e.qty+=1; e.locs.push(loc); e.ops.push(op); doors.set(key,e); } }
  const W=[...wins.values()].sort((a,b)=>a.code.localeCompare(b.code)), D=[...doors.values()].sort((a,b)=>(a.kind>b.kind)-(a.kind<b.kind)||a.code.localeCompare(b.code));
  W.forEach((e,i)=>{ e.mark='W'+(i+1); e.ops.forEach(o=>o.mark=e.mark); }); D.forEach((e,i)=>{ e.mark='D'+(i+1); e.ops.forEach(o=>o.mark=e.mark); });
  return {W,D};
}
// white-background snapshots of the 3D model for the cover and views sheet
function snapView(dirName, ortho){
  const bg=scene.background, fog=scene.fog, dv=dimsGroup.visible, mv=measGroup.visible, cv=cursorDot.visible, pv=prevLine.visible, gv=ground.visible, gr=grid.visible;
  scene.background=new THREE.Color('#ffffff'); scene.fog=null; dimsGroup.visible=false; measGroup.visible=false; cursorDot.visible=false; prevLine.visible=false; ground.visible=false; grid.visible=false;
  const el=renderer.domElement, aspect=el.width/el.height, d=new THREE.Vector3(...VIEWS[dirName]).normalize(), tg=new THREE.Vector3(0,9,0);
  let c; if(ortho){ const halfW=(dirName==='left'||dirName==='right')?25:18, hh=Math.max(15, halfW/aspect)*1.08; tg.y=11.2; c=new THREE.OrthographicCamera(-hh*aspect,hh*aspect,hh,-hh,-500,500); } else { c=new THREE.PerspectiveCamera(36,aspect,0.5,600); }
  c.position.copy(tg).addScaledVector(d,ortho?150:78); c.lookAt(tg); c.updateProjectionMatrix();
  renderer.render(scene,c); const url=el.toDataURL('image/jpeg',0.92);
  scene.background=bg; scene.fog=fog; dimsGroup.visible=dv; measGroup.visible=mv; cursorDot.visible=cv; prevLine.visible=pv; ground.visible=gv; grid.visible=gr; renderer.render(scene,cam);
  return {url,aspect};
}

      doc.setPage(1); doc.autoTable({startY:idxY+6,theme:'grid',tableWidth:480,margin:{left:MG+16},styles:{fontSize:7.6,cellPadding:3,lineColor:[150,150,150],lineWidth:0.4,textColor:20},headStyles:{fillColor:[45,45,45],textColor:255},head:[['Sheet','Title']],body:rows.map(r=>r.map(pt)),columnStyles:{0:{cellWidth:80}}});
      doc.setPage(n); }
    // ---- save ----
    const blob=doc.output('blob'), filename=`Bastine-House-LBM-quote-set-${new Date().toISOString().slice(0,10)}.pdf`;
    msg.textContent=`${doc.internal.getNumberOfPages()} sheets ready…`;
    const dl = window.claude?.use ? await Promise.race([window.claude.use('downloads'), new Promise(r=>setTimeout(()=>r(null),4000))]).catch(()=>null) : null;
    if(dl){ try{ await dl.save({filename,data:blob}); msg.textContent=`Saved ${filename}`; }
            catch(e){ msg.textContent = e?.code==='declined' ? 'Save cancelled.' : e?.code==='rate_limited' ? 'A save prompt is already open.' : 'Saving isn\'t available in this view.'; } }
    else { doc.save(filename); msg.textContent=`Downloaded ${filename}`; }
  } catch(e){ console.error(e); msg.textContent=(e&&e.message)?e.message:'Export failed.'; }
  finally{ btn.disabled=false; if(state.view!=='3d') renderPlan(); }
}
document.getElementById('b-pdf').addEventListener('click',exportPdfSet);

const $=s=>document.querySelector(s);
const EYE_ON='<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z"/><circle cx="8" cy="8" r="2"/></svg>';
const EYE_OFF='<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 2l12 12M6.5 3.3A7 7 0 0 1 8 3c4.5 0 7 5 7 5a12 12 0 0 1-2 2.6M4 4.9C2.2 6.1 1 8 1 8s2.5 5 7 5a6.6 6.6 0 0 0 3-.7"/></svg>';
const CHEV='<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>';
function measureText(L,c){ const m=c.meas; switch(L.basis){ case 'LF wall': return `${num(m)} LF of wall`; case 'sq ft': return `${num(m)} sf framed deck`; case 'truss': return `${m} trusses @ 24" o.c.`; case 'sq ft roof': return `${num(m)} sf of roof`; case 'sheet': return `${num(m)} sheets`; case 'piece': return `${num(m)} pieces`; case 'item': return `${num(m)} items · visual only, not priced`; } }
function linesTable(lines){ if(!lines.length) return '<p class="note">No priced items.</p>';
  return `<div class="tw"><table><thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Unit</th><th class="n">Ext.</th></tr></thead><tbody>${lines.map(l=>`<tr><td>${esc(l.desc)}<small>${esc(l.uses)}</small></td><td class="n">${num(l.qty)} ${l.unit}</td><td class="n">${money2(l.uc)}</td><td class="n">${money(l.cost)}</td></tr>`).join('')}</tbody></table></div>`; }

function renderLayers(){
  const c=COST;
  const stack=LAYERS.filter(L=>state.layers[L.id].inc && c.layers[L.id].total>0).map(L=>`<i style="width:${c.layers[L.id].total/(c.mat||1)*100}%;background:${L.color}" title="${esc(L.name)}"></i>`).join('');
  $('#tab-layers').innerHTML=`
   <div class="card"><h3>Framing options</h3><div class="opts">
     <label class="opt" for="o-oc">Exterior studs<select id="o-oc"><option value="16">2x6 @ 16" o.c.</option><option value="24">2x6 @ 24" o.c. (advanced framing)</option></select></label>
     <label class="opt" for="o-j">2nd floor system<select id="o-j"><option value="ft">12" open-web floor truss @ 24"</option><option value="ft16">16" floor truss @ 24" (trunk chase)</option><option value="ij">11-7/8" I-joist @ 16"</option><option value="syp">2x12 #2 SYP @ 16"</option></select></label>
     <label class="opt" for="o-g">Dimensions<select id="o-g"><option value="resolved">Resolved</option><option value="drawn">As drawn</option></select></label>
     <label class="opt" for="o-s">Opening layout<select id="o-s"><option value="1">Align to stud layout (≤ 4")</option><option value="0">Keep drawn locations</option></select></label>
     <label class="opt" for="o-c">Cut list<select id="o-c"><option value="1">Optimized cutting</option><option value="0">Simple 16' nesting</option></select></label>
     <label class="opt" for="o-pp">Porch posts<select id="o-pp"><option value="4">4 posts, as drawn</option><option value="5">5 posts (one added in the long bay)</option></select></label>
     <label class="opt" for="o-tp">Patio posts<select id="o-tp"><option value="2">Corner + mid post</option><option value="1">Corner post only, as drawn</option></select></label>
     <label class="opt" for="o-st">Stair<select id="o-st"><option value="land2">1 step + landing step</option><option value="land1">Landing as the only step</option><option value="land6">6 steps + landing</option></select></label>
     <label class="opt" for="o-bd">Bedroom depth<select id="o-bd"><option value="11">11'-0" clear (owner sketch)</option><option value="10">10'-0" clear</option><option value="0">As drawn</option></select></label>
     <label class="opt" for="o-h">Headers<select id="o-h"><option value="auto">Built-up SYP, sized by span</option><option value="std">Built-up SYP, deepest that fits</option><option value="lvl">LVL headers</option></select></label>
   </div></div>
   <div class="card"><h3>Package summary</h3>
     <div class="sum"><span>Lumber, trusses, panels & hardware (${state.market===1?'SE average':'×'+state.market.toFixed(2)})</span><b data-k="mat">${money(c.mat)}</b>
     <span>Sales tax ${state.tax}% on material</span><b data-k="tax">${money(c.tax)}</b>
     <span>Delivery</span><b>${money(c.mat>0?state.delivery:0)}</b>
     <span class="t">Package total</span><b data-k="tot">${money(c.total)}</b></div>
     <div class="stack" aria-hidden="true">${stack}</div>
     <p class="note">Bar shows each included layer's share of material.</p></div>
   ${LAYERS.map(L=>{ const lc=c.layers[L.id], st=state.layers[L.id], open=state.open.has(L.id);
     return `<div class="layer${st.inc?'':' off'}" data-id="${L.id}">
      <div class="lh">
        ${L.novis?'<span></span>':`<button class="eye" aria-pressed="${st.vis}" aria-label="Show ${esc(L.name)} in 3D" data-act="vis">${st.vis?EYE_ON:EYE_OFF}</button>`}
        <span class="sw" style="background:${L.color}"></span>
        <div class="ln"><b>${esc(L.name)}</b><small>${measureText(L,lc)}</small></div>
        <label class="inc" title="Include in package total"><input type="checkbox" data-act="inc" ${st.inc?'checked':''} aria-label="Include ${esc(L.name)} in total"></label>
        <div class="lc" data-cost="${L.id}">${money(lc.total)}</div>
        <button class="chev" aria-expanded="${open}" aria-label="Details" data-act="open">${CHEV}</button>
      </div>
      <div class="lb" ${open?'':'hidden'}>
        ${linesTable(lc.lines)}
      </div></div>`; }).join('')}
   <p class="note">Quantities include ${state.waste.L}% lumber cull allowance, ${state.waste.P}% panels, ${state.waste.E}% engineered. ${state.cutopt?`Dimensional lumber is cut-optimized (${num((COST.yield||0)*100,1)}% yield).`:'Short cuts are nested from 16-foot stock.'}</p>`;
  $('#o-bd').value=String(state.bedClear||0); $('#o-st').value=state.stair; $('#o-pp').value=String(state.porchPosts); $('#o-tp').value=String(state.patioPosts); $('#o-g').value=state.geo; $('#o-s').value=state.snap?'1':'0'; $('#o-c').value=state.cutopt?'1':'0'; $('#o-oc').value=String(state.extOC); $('#o-j').value=state.joist; $('#o-h').value=state.header;
}
$('#tab-layers').addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='o-oc'){ state.extOC=+e.target.value; rebuild(); return; }
  if(id==='o-j'){ state.joist=e.target.value; rebuild(); return; }
  if(id==='o-h'){ state.header=e.target.value; rebuild(); return; }
  if(id==='o-g'){ state.geo=e.target.value; rebuild(); return; }
  if(id==='o-pp'){ state.porchPosts=+e.target.value; rebuild(); return; }
  if(id==='o-st'){ state.stair=e.target.value; rebuild(); return; }
  if(id==='o-bd'){ state.bedClear=+e.target.value; rebuild(); return; }
  if(id==='o-tp'){ state.patioPosts=+e.target.value; rebuild(); return; }
  if(id==='o-s'){ state.snap=e.target.value==='1'; rebuild(); return; }
  if(id==='o-c'){ state.cutopt=e.target.value==='1'; rebuild(); return; }
  const lay=e.target.closest('.layer'); if(!lay) return;
  if(e.target.dataset.act==='inc'){ state.layers[lay.dataset.id].inc=e.target.checked; refreshCosts(true); }
});
$('#tab-layers').addEventListener('click',e=>{ const b=e.target.closest('button[data-act]'); if(!b) return; const lay=b.closest('.layer'), id=lay.dataset.id;
  if(b.dataset.act==='vis'){ const st=state.layers[id]; st.vis=!st.vis; b.setAttribute('aria-pressed',st.vis); b.innerHTML=st.vis?EYE_ON:EYE_OFF; applyVisibility(); renderPlan(); if(selected&&!selected.parent.visible) select(null); }
  if(b.dataset.act==='open'){ const open=!state.open.has(id); open?state.open.add(id):state.open.delete(id); b.setAttribute('aria-expanded',open); lay.querySelector('.lb').hidden=!open; } });

function takeoffAll(){ const map=new Map();
  for(const L of LAYERS){ if(!state.layers[L.id].inc) continue; for(const l of COST.layers[L.id].lines){ const k=l.desc.replace(/ \(cut list.*\)| \(\d[\d,]* sf\)/,'')+'|'+l.sku+'|'+l.unit+'|'+l.uc.toFixed(4);
      const e=map.get(k)||{...l,desc:l.desc.replace(/ \(cut list.*\)| \(\d[\d,]* sf\)/,''),qty:0,cost:0,bf:0,layers:new Set()}; e.qty+=l.qty; e.cost+=l.cost; e.bf+=l.bf; e.layers.add(L.name.split(' · ')[0].replace('Main Roof','Roof')); map.set(k,e); } }
  return [...map.values()]; }
function renderTakeoff(){
  const all=takeoffAll(); const byCat={}; for(const l of all)(byCat[l.cat]=byCat[l.cat]||[]).push(l);
  const bfTot=all.reduce((s,l)=>s+l.bf,0);
  $('#tab-takeoff').innerHTML=`<div class="card"><div class="grp"><h3>Lumber package by type</h3><button class="btn" id="csv">Copy CSV</button></div>
     <div class="sum"><span>Dimensional + PT lumber</span><b>${num(bfTot)} BF</b><span>Material subtotal</span><b>${money(COST.mat)}</b></div></div>
   ${CAT_ORDER.filter(c=>byCat[c]).map(cat=>{ const ls=byCat[cat].sort((a,b)=>b.cost-a.cost); const sub=ls.reduce((s,l)=>s+l.cost,0); const bf=ls.reduce((s,l)=>s+l.bf,0);
     return `<div class="card"><div class="grp"><h3>${cat}</h3><span>${bf?num(bf)+' BF · ':''}${money(sub)}</span></div><div class="tw"><table><thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Ext.</th></tr></thead><tbody>
      ${ls.map(l=>`<tr><td>${esc(l.desc)}<small>${esc([...l.layers].join(' · '))}</small></td><td class="n">${num(l.qty)} ${l.unit}</td><td class="n">${money(l.cost)}</td></tr>`).join('')}</tbody></table></div></div>`; }).join('')}
   <p class="note" id="csv-msg">Totals reflect included layers only. Toggle layers on the Layers tab.</p>`;
  $('#csv').onclick=async()=>{ const rows=[['Category','Item','Qty','Unit','Unit cost','Extended','Layers']]; for(const cat of CAT_ORDER) for(const l of (byCat[cat]||[])) rows.push([cat,l.desc,l.qty,l.unit,l.uc.toFixed(2),l.cost.toFixed(2),[...l.layers].join('; ')]);
    const txt=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    try{ await navigator.clipboard.writeText(txt); $('#csv-msg').textContent='Copied takeoff CSV to the clipboard.'; }catch{ $('#csv-msg').textContent='Clipboard blocked here. Select the tables above and copy them manually.'; } };
}

  const byCat={}; for(const [k,v] of Object.entries(PB))(byCat[v.cat]=byCat[v.cat]||[]).push([k,v]);

      <label class="opt" for="p-mkt">Market adjust<span class="row"><input type="range" id="p-mkt" min="0.8" max="1.25" step="0.01" value="${state.market}"><b id="p-mktv" style="font-family:var(--mono);font-size:12px">×${state.market.toFixed(2)}</b></span></label>
      <label class="opt" for="p-tax">Sales tax %<input type="number" id="p-tax" step="0.25" min="0" value="${state.tax}"></label>

    </div></div>
    <div class="card"><h3>Waste factors %</h3><div class="pb">
      <label for="w-L">Lumber cull & breakage</label><input type="number" id="w-L" data-w="L" min="0" step="1" value="${state.waste.L}">

    <div class="row"><button class="btn" id="p-reset">Reset to SE averages</button></div>

$('#tab-prices').addEventListener('input',e=>{ const t=e.target; const v=parseFloat(t.value);
  if(t.dataset.sku){ if(v>=0){ state.prices[t.dataset.sku]=v; refreshCosts(); } return; }
  if(t.dataset.w){ if(v>=0){ state.waste[t.dataset.w]=v; refreshCosts(); } return; }
  if(t.id==='p-mkt'){ state.market=v; $('#p-mktv').textContent='×'+v.toFixed(2); refreshCosts(); }
  if(t.id==='p-tax'&&v>=0){ state.tax=v; refreshCosts(); }
  if(t.id==='p-del'&&v>=0){ state.delivery=v; refreshCosts(); } });
$('#tab-prices').addEventListener('click',e=>{ if(e.target.id!=='p-reset') return; for(const [k,v] of Object.entries(PB)) state.prices[k]=v.price; state.waste={...DEFAULT_WASTE}; state.market=1; state.tax=7; state.delivery=195; renderPrices(); refreshCosts(); });

function renderChecks(){
  const C=buildChecks(); const cnt={ok:0,warn:0,info:0,fix:0}; C.forEach(c=>cnt[c.st]++);
  const secs=[...new Set(C.map(c=>c.sec))];
  $('#tab-checks').innerHTML=`<div class="card"><h3>Drawing & framing validation</h3><div class="chips"><span class="pill ok">${cnt.ok} pass</span><span class="pill warn">${cnt.warn} review</span>${cnt.fix?`<span class="pill fix">${cnt.fix} resolved</span>`:''}<span class="pill info">${cnt.info} note</span></div>
     <p class="note" style="margin-top:8px">Dimension strings are summed against overall dimensions from A-1/A-2; elevations from A-3–A-6; pitches from A-9. ${state.geo==='resolved'?'Resolved mode closes each string.':'Showing the drawings as dimensioned.'} Header and span checks use simplified IRC tables for #2 SYP and are not a substitute for engineering.</p></div>
   ${secs.map(s=>{ const items=C.filter(c=>c.sec===s); const w=items.filter(c=>c.st==='warn').length;
     return `<div class="card"><div class="grp"><h3>${s}</h3><span>${w?w+' to review':'all clear'}</span></div>${items.map(c=>`<div class="chk"><span class="pill ${c.st}">${{ok:'pass',warn:'review',info:'note',fix:'resolved'}[c.st]}</span><div><b>${c.title}</b><p>${c.detail}</p></div></div>`).join('')}</div>`; }).join('')}`;
  const b=$('#chk-badge'); b.textContent=cnt.warn; b.hidden=!cnt.warn;
}

function updateKPIs(){ $('#k-mat').textContent=money(COST.mat); $('#k-bf').textContent=num(COST.bf)+' BF'; $('#k-tot').textContent=money(COST.total); $('#k-psf').textContent=money2(COST.total/COST.area); }
function refreshCosts(){ recalc(); updateKPIs(); renderLayers(); renderTakeoff(); renderChecks(); }
function scenario(over){ const bak={geo:state.geo,snap:state.snap,cutopt:state.cutopt}; Object.assign(state,over); buildModel(); const c=recalc(); Object.assign(state,bak); return {mat:c.mat,pcs:c.pcs,bf:c.bf}; }
function rebuild(){
  SCEN={ base:scenario({geo:'drawn',snap:false,cutopt:false}), noOpt:scenario({cutopt:false}), drawn:scenario({geo:'drawn'}), noSnap:scenario({snap:false}) };
  buildModel(); buildScene(); recalc(); buildDims(); updateKPIs(); renderLayers(); renderTakeoff(); renderChecks(); renderPlan(); }

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{ document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t?'true':'false'));
  for(const id of ['layers','takeoff','prices','checks']) document.getElementById('tab-'+id).hidden = id!==t.dataset.tab; }));
document.querySelectorAll('.vb[data-v]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.v)));
$('#b-ortho').addEventListener('click',()=>setOrtho(!state.ortho));
$('#b-dims').addEventListener('click',e=>{ state.dims=!state.dims; e.currentTarget.setAttribute('aria-pressed',state.dims); dimsGroup.visible=state.dims; labelsEl.hidden=!state.dims; });
$('#b-fit').addEventListener('click',()=>setView('iso'));
$('#explode').addEventListener('input',e=>{ state.explode=+e.target.value; applyExplode(); });

rebuild(); renderPrices(); requestAnimationFrame(loop);
window.__app={state,COST:()=>COST,M:()=>M,cam:()=>cam,controls,setView,renderer,THREE,setOrtho};
